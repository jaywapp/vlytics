name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: vlytics_test
          POSTGRES_PASSWORD: ci-bootstrap-password
          POSTGRES_USER: vlytics_bootstrap_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vlytics_bootstrap_admin -d vlytics_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VLYTICS_TEST_DATABASE_URL: postgresql+psycopg://vlytics_migrator:ci-migrator-password@localhost:5432/vlytics_test
      VLYTICS_TEST_COLLECTOR_DATABASE_PASSWORD: ci-collector-password
      VLYTICS_TEST_ENGINE_DATABASE_PASSWORD: ci-engine-password
      VLYTICS_TEST_MARKET_INGEST_DATABASE_PASSWORD: ci-market-password
      VLYTICS_TEST_READ_API_DATABASE_PASSWORD: ci-read-api-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Initialize one-time migrator
        env:
          PGPASSWORD: ci-bootstrap-password
          MIGRATOR_DATABASE_PASSWORD: ci-migrator-password
        run: psql -h localhost -U vlytics_bootstrap_admin -d vlytics_test -v ON_ERROR_STOP=1 -f ../infra/postgres-init/001-create-migrator.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - name: Validate Compose configuration
        env:
          MIGRATOR_DATABASE_PASSWORD: compose-ci-migrator
          MIGRATOR_DATABASE_URL: postgresql+psycopg://vlytics_migrator:compose-ci-migrator@postgres:5432/vlytics
          COLLECTOR_DATABASE_PASSWORD: compose-ci-collector
          ENGINE_DATABASE_PASSWORD: compose-ci-engine
          MARKET_INGEST_DATABASE_PASSWORD: compose-ci-market
          READ_API_DATABASE_PASSWORD: compose-ci-read-api
          READ_API_DATABASE_URL: postgresql+psycopg://vlytics_read_api_login:compose-ci-read-api@postgres:5432/vlytics
          ENGINE_DATABASE_URL: postgresql+psycopg://vlytics_engine_login:compose-ci-engine@postgres:5432/vlytics
        run: docker compose -f ../infra/compose.yaml config --quiet
      - name: Smoke test Compose stack, frontend image, and restore
        env:
          POSTGRES_PORT: 55432
          API_PORT: 18080
          WEB_PORT: 18081
          VLYTICS_CI_NODE_IMAGE: node:22-alpine
          VLYTICS_CI_NGINX_IMAGE: nginx:stable-alpine
          MIGRATOR_DATABASE_PASSWORD: compose-ci-migrator
          MIGRATOR_DATABASE_URL: postgresql+psycopg://vlytics_migrator:compose-ci-migrator@postgres:5432/vlytics
          COLLECTOR_DATABASE_PASSWORD: compose-ci-collector
          ENGINE_DATABASE_PASSWORD: compose-ci-engine
          MARKET_INGEST_DATABASE_PASSWORD: compose-ci-market
          READ_API_DATABASE_PASSWORD: compose-ci-read-api
          READ_API_DATABASE_URL: postgresql+psycopg://vlytics_read_api_login:compose-ci-read-api@postgres:5432/vlytics
          ENGINE_DATABASE_URL: postgresql+psycopg://vlytics_engine_login:compose-ci-engine@postgres:5432/vlytics
          VLYTICS_OPERATOR_AUTH_SECRET: compose-ci-operator
          VLYTICS_READONLY_AUTH_SECRET: compose-ci-readonly
        run: bash ../infra/scripts/ci-compose-smoke.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production-preview end-to-end tests
        run: npm run test:e2e:ci