name: Windows Installer

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Assign a unique increasing MSI version
        id: version
        shell: powershell
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $buildNumber = [int]$env:BUILD_NUMBER
          if ($buildNumber -gt 65535) { throw 'MSI build counter exhausted; increment the version series.' }
          $version = "1.0.$buildNumber"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          python-version: '3.12.14'
          enable-cache: true
      - name: Install the pinned managed Python runtime
        run: uv python install 3.12.14
      - name: Test generated deployment settings and preflight contracts
        working-directory: backend
        run: uv run --frozen pytest tests/test_desktop_settings.py tests/test_deployment_scripts.py
      - name: Restore desktop solution
        run: dotnet restore desktop/Vlytics.Windows.slnx
      - name: Test settings core
        run: dotnet test desktop/Vlytics.Settings.Tests/Vlytics.Settings.Tests.csproj --configuration Release --no-restore
      - name: Build and self-check MSI and portable package
        shell: powershell
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: .\desktop\build-installer.ps1 -Version $env:PACKAGE_VERSION -Configuration Release
      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vlytics-settings-windows-${{ steps.version.outputs.version }}
          path: |
            artifacts/windows-installer/*.msi
            artifacts/windows-installer/*.zip
            artifacts/windows-installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vlytics-settings-windows-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Publish a new GitHub Release for this push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          tag="v${PACKAGE_VERSION}"
          flags=(--latest=false)
          if [[ "$SOURCE_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            flags+=(--prerelease)
          else
            head_sha="$(gh api "repos/${GH_REPO}/commits/${DEFAULT_BRANCH}" --jq .sha)"
            if [[ "$head_sha" == "$SOURCE_SHA" ]]; then flags=(--latest); fi
          fi
          printf 'Windows 설정 앱과 MSI 설치 파일입니다.\n\n버전: `%s`\n커밋: `%s`\n브랜치: `%s`\n\nMSI는 사용자별 설치, ZIP은 무설치 실행용입니다. .NET 런타임을 포함합니다. Docker Desktop(Linux 컨테이너), Compose 2.33.1 이상, uv/Python 및 실제 운영 검증 값은 별도로 준비하세요.\n\nAPI 키와 사용자 데이터는 포함하지 않습니다. 업그레이드와 제거는 사용자 설정 및 DB 볼륨을 삭제하지 않습니다.\n' "$PACKAGE_VERSION" "$SOURCE_SHA" "$SOURCE_BRANCH" > release-notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            existing_target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            if [[ "$existing_target" != "$SOURCE_SHA" ]]; then
              echo 'Release tag already belongs to another commit.' >&2
              exit 1
            fi
            gh release upload "$tag" ./*.msi ./*.zip SHA256SUMS.txt --clobber
          else
            gh release create "$tag" ./*.msi ./*.zip SHA256SUMS.txt --target "$SOURCE_SHA" --title "Vlytics Settings $PACKAGE_VERSION" --notes-file release-notes.md "${flags[@]}"
          fi
