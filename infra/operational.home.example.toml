schema_version = "1.0"
environment = "production"
# Approved home defaults. Fill secrets last; review FX and dry-run before activation.
live_operations_enabled = true

[deployment]
profile = "personal_home"
live_enabled = true
host_class = "dedicated_private_machine"
host_provider = "existing_home_server"
host_region = "home_lan"
monthly_cost_limit = 0
cost_currency = "KRW"
network_access = "loopback"
operator_auth_method = "private_network_identity"
operator_secret_env = "VLYTICS_OPERATOR_AUTH_SECRET"
clock_sync_required = true

[database]
engine = "postgresql"
connection_url_env = "VLYTICS_DATABASE_URL"
raw_storage = "postgresql_private"

[backup]
enabled = false
strategy = "__REQUIRED__"
interval_hours = 0
retention_days = 0
rpo_minutes = 0
rto_minutes = 0
credential_env = "VLYTICS_BACKUP_CREDENTIAL"

[alerting]
enabled = false
channel = "__REQUIRED__"
destination_env = "VLYTICS_ALERT_DESTINATION"

[ai]
live_calls_enabled = true
budget_currency = "KRW"
# Set reviewed KRW per USD before activation. Missing conversion blocks live calls.
# pricing_to_budget_rate = <reviewed_positive_KRW_per_USD>

[ai.openai]
enabled = true
model_id = "gpt-6-sol"
version_policy = "verify_resolved_model_id"
# Replace only with the resolved model version observed during the final smoke.
pinned_model_version = "__REQUIRED_AFTER_MODEL_SMOKE__"
api_key_env = "VLYTICS_OPENAI_API_KEY"
daily_budget_amount = 1000
monthly_budget_amount = 10000
max_calls_per_match = 3
daily_call_limit = 100
monthly_call_limit = 1000
max_input_tokens_per_call = 4000
max_output_tokens_per_call = 1000

[ai.anthropic]
enabled = false
model_id = "__REQUIRED__"
version_policy = "unconfigured"
pinned_model_version = "__REQUIRED__"
api_key_env = "VLYTICS_ANTHROPIC_API_KEY"
daily_budget_amount = 0
monthly_budget_amount = 0
max_calls_per_match = 0
daily_call_limit = 0
monthly_call_limit = 0
max_input_tokens_per_call = 0
max_output_tokens_per_call = 0

[ai.google]
enabled = false
model_id = "__REQUIRED__"
version_policy = "unconfigured"
pinned_model_version = "__REQUIRED__"
api_key_env = "VLYTICS_GOOGLE_API_KEY"
daily_budget_amount = 0
monthly_budget_amount = 0
max_calls_per_match = 0
daily_call_limit = 0
monthly_call_limit = 0
max_input_tokens_per_call = 0
max_output_tokens_per_call = 0

[timing]
target_cutoff_minutes = 60
initial_start_tolerance_seconds = 30
completion_grace_seconds = 300
request_timeout_seconds = 60
max_attempts = 3
retry_initial_delay_seconds = 5
retry_backoff_multiplier = 2
retry_max_delay_seconds = 30
allow_t10_retry = false
allow_completion_at_or_after_scheduled_start = false
allow_completion_at_or_after_actual_start = false
deadline_rule = "min(cutoff_at + completion_grace, scheduled_start_at, actual_start_at_if_known)"

[results]
poll_interval_seconds = 300
provisional_stability_seconds = 1800
correction_recheck_interval_seconds = 21600
correction_recheck_window_hours = 168

[source]
bulk_collection_enabled = false
permission_policy = "personal analysis only; collection disabled pending permission evidence"
max_requests_per_minute = 0
max_concurrency = 0
scopes = []

[activation]
dry_run_evidence_max_age_hours = 24
dry_run_evidence_max_bytes = 16384
# Set the SHA-256 of the finalized variants file before generating dry-run evidence.
# provider_registry_sha256 = "<reviewed_registry_sha256>"
