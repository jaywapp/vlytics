name: vlytics

x-backend-service: &backend-service
  image: ${VLYTICS_BACKEND_IMAGE:?VLYTICS_BACKEND_IMAGE is required}
  init: true
  read_only: true
  user: "65532:65532"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  networks:
    - private
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-backend-environment: &backend-environment
  VLYTICS_OPERATIONAL_CONFIG_PATH: /run/vlytics/operational.toml
  VLYTICS_OPERATIONAL_SCHEMA_PATH: /run/vlytics/config.schema.json
  VLYTICS_LIVE_DRY_RUN_EVIDENCE_PATH: /run/vlytics/live-dry-run-evidence.json
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

x-backend-volumes: &backend-volumes
  - ${VLYTICS_OPERATIONAL_CONFIG_FILE:-./operational.production.example.toml}:/run/vlytics/operational.toml:ro
  - ../contracts/config.schema.json:/run/vlytics/config.schema.json:ro
  - ${VLYTICS_LIVE_DRY_RUN_EVIDENCE_FILE:-./live-dry-run-evidence.example.json}:/run/vlytics/live-dry-run-evidence.json:ro

services:
  postgres:
    image: ${VLYTICS_POSTGRES_IMAGE:-postgres:17.11-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vlytics}
      POSTGRES_USER: vlytics_bootstrap_admin
      POSTGRES_PASSWORD: ${MIGRATOR_DATABASE_PASSWORD:?MIGRATOR_DATABASE_PASSWORD is required}
      MIGRATOR_DATABASE_PASSWORD: ${MIGRATOR_DATABASE_PASSWORD:?MIGRATOR_DATABASE_PASSWORD is required}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlytics_migrator -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  migrate:
    <<: *backend-service
    restart: "no"
    command: ["vlytics-migrate"]
    environment:
      <<: *backend-environment
      VLYTICS_MIGRATION_DATABASE_URL: ${MIGRATOR_DATABASE_URL:?MIGRATOR_DATABASE_URL is required}
      VLYTICS_COLLECTOR_DATABASE_PASSWORD: ${COLLECTOR_DATABASE_PASSWORD:?COLLECTOR_DATABASE_PASSWORD is required}
      VLYTICS_ENGINE_DATABASE_PASSWORD: ${ENGINE_DATABASE_PASSWORD:?ENGINE_DATABASE_PASSWORD is required}
      VLYTICS_MARKET_INGEST_DATABASE_PASSWORD: ${MARKET_INGEST_DATABASE_PASSWORD:?MARKET_INGEST_DATABASE_PASSWORD is required}
      VLYTICS_READ_API_DATABASE_PASSWORD: ${READ_API_DATABASE_PASSWORD:?READ_API_DATABASE_PASSWORD is required}
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend-service
    restart: unless-stopped
    command: ["vlytics-api"]
    environment:
      <<: *backend-environment
      VLYTICS_DATABASE_URL: ${READ_API_DATABASE_URL:?READ_API_DATABASE_URL is required}
      VLYTICS_OPERATOR_AUTH_SECRET: ${VLYTICS_OPERATOR_AUTH_SECRET:?VLYTICS_OPERATOR_AUTH_SECRET is required}
      VLYTICS_READONLY_AUTH_SECRET: ${VLYTICS_READONLY_AUTH_SECRET:?VLYTICS_READONLY_AUTH_SECRET is required}
    volumes: *backend-volumes
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend-service
    restart: unless-stopped
    command: ["vlytics-worker"]
    environment:
      <<: *backend-environment
      VLYTICS_DATABASE_URL: ${ENGINE_DATABASE_URL:?ENGINE_DATABASE_URL is required}
      VLYTICS_OPENAI_API_KEY: ${VLYTICS_OPENAI_API_KEY:?VLYTICS_OPENAI_API_KEY is required}
      VLYTICS_ANTHROPIC_API_KEY: ${VLYTICS_ANTHROPIC_API_KEY:?VLYTICS_ANTHROPIC_API_KEY is required}
      VLYTICS_GOOGLE_API_KEY: ${VLYTICS_GOOGLE_API_KEY:?VLYTICS_GOOGLE_API_KEY is required}
    volumes: *backend-volumes
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${VLYTICS_FRONTEND_IMAGE:?VLYTICS_FRONTEND_IMAGE is required}
    restart: unless-stopped
    init: true
    read_only: true
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=4m
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - private
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:

networks:
  private:
    internal: true